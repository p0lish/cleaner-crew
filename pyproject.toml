[project]
name = "cleaner-crew"
version = "0.1.1"
description = "Autonomous crew of Claude Code agents that picks up small, safe tasks and opens MRs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.scripts]
cleaner-crew = "cleaner_crew.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleaner_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
