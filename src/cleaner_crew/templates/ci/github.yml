name: cleaner-crew

on:
  schedule:
    - cron: "17 3 * * 1-5"   # weekday nights
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only, change nothing"
        type: boolean
        default: false

concurrency:
  group: cleaner-crew
  cancel-in-progress: false

# Pushes and PRs use CLEANER_CREW_TOKEN (a fine-grained PAT with Contents + Pull requests
# read/write on this repo), not GITHUB_TOKEN: GitHub doesn't trigger workflows such as
# cleaner-crew-verify for PRs opened with GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  crew:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CLEANER_CREW_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
__INSTALL_STEPS__
      - name: Run cleaner crew
        env:
          # Set one of these: an API key, or `claude setup-token` for a Pro/Max subscription.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CLEANER_CREW_TOKEN }}
          __TRACKER_ENV__
        run: |
          git config user.name "Cleaner Crew"
          git config user.email "cleaner-crew@users.noreply.github.com"
          uvx --from "__PACKAGE_SPEC__" cleaner-crew run ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleaner-crew-audit
          path: .cleaner-crew/runs/
          retention-days: 30
