name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release workflow runs the same checks before publishing

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Wheel ships every template
        run: |
          python - <<'EOF'
          import glob, pathlib, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          expected = {f"cleaner_crew/{p.relative_to('src/cleaner_crew')}"
                      for p in pathlib.Path("src/cleaner_crew/templates").rglob("*")
                      if p.is_file() and p.suffix != ".pyc"}
          missing = sorted(expected - names)
          assert not missing, f"missing from wheel: {missing}"
          print(f"{wheel}: {len(expected)} template files present")
          EOF
      - name: Installed wheel runs
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/cleaner-crew --help
